<?xml version="1.0" encoding="UTF-8"?>
<!-- Claude Light macOS app icon (1024×1024). Source of truth for Resources/AppIcon.icns;
     regenerate with scripts/make-icns.sh after editing. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- App body -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5360"/>
      <stop offset="0.5" stop-color="#3f4450"/>
      <stop offset="1" stop-color="#33373f"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7180" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#565c69" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#20232a" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Capsule housing -->
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#24272f"/>
    </linearGradient>
    <linearGradient id="capsuleRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6472"/>
      <stop offset="0.5" stop-color="#4a505c"/>
      <stop offset="1" stop-color="#2c3038"/>
    </linearGradient>
    <!-- Lamps -->
    <radialGradient id="red" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="0.45" stop-color="#f44a35"/>
      <stop offset="1" stop-color="#c22314"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#fba000"/>
      <stop offset="1" stop-color="#d97d00"/>
    </radialGradient>
    <radialGradient id="green" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#a4ecab"/>
      <stop offset="0.45" stop-color="#46d162"/>
      <stop offset="1" stop-color="#1f9e3c"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="capsuleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="lampShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Body squircle (824×824 on the Apple icon grid, transparent margins) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none"
        stroke="url(#bodyEdge)" stroke-width="6"/>

  <!-- Capsule housing -->
  <g filter="url(#capsuleShadow)">
    <rect x="354" y="196" width="316" height="632" rx="158" fill="url(#capsuleRim)"/>
  </g>
  <rect x="372" y="214" width="280" height="596" rx="140" fill="url(#capsule)"/>

  <!-- Lamps -->
  <g filter="url(#lampShadow)">
    <circle cx="512" cy="330" r="92" fill="url(#red)"/>
  </g>
  <circle cx="512" cy="330" r="92" fill="none" stroke="#14161a" stroke-width="5" stroke-opacity="0.55"/>
  <ellipse cx="500" cy="292" rx="52" ry="28" fill="url(#gloss)"/>

  <g filter="url(#lampShadow)">
    <circle cx="512" cy="512" r="92" fill="url(#orange)"/>
  </g>
  <circle cx="512" cy="512" r="92" fill="none" stroke="#14161a" stroke-width="5" stroke-opacity="0.55"/>
  <ellipse cx="500" cy="474" rx="52" ry="28" fill="url(#gloss)"/>

  <g filter="url(#lampShadow)">
    <circle cx="512" cy="694" r="92" fill="url(#green)"/>
  </g>
  <circle cx="512" cy="694" r="92" fill="none" stroke="#14161a" stroke-width="5" stroke-opacity="0.55"/>
  <ellipse cx="500" cy="656" rx="52" ry="28" fill="url(#gloss)"/>
</svg>
