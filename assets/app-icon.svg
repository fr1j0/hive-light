<?xml version="1.0" encoding="UTF-8"?>
<!-- Claude Light macOS app icon (1024×1024). Source of truth for Resources/AppIcon.icns;
     regenerate with scripts/make-icns.sh after editing. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- App body -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b414b"/>
      <stop offset="0.35" stop-color="#2d3138"/>
      <stop offset="1" stop-color="#24272e"/>
    </linearGradient>
    <!-- Capsule bezel rim -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#707886"/>
      <stop offset="0.12" stop-color="#565d69"/>
      <stop offset="0.9" stop-color="#3f444d"/>
      <stop offset="1" stop-color="#32363e"/>
    </linearGradient>
    <linearGradient id="capsuleInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1013"/>
      <stop offset="1" stop-color="#16181d"/>
    </linearGradient>
    <!-- Lamps -->
    <radialGradient id="red" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ff8577"/>
      <stop offset="0.45" stop-color="#ee4633"/>
      <stop offset="1" stop-color="#b8251b"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffd98c"/>
      <stop offset="0.45" stop-color="#f8a91f"/>
      <stop offset="1" stop-color="#d07d00"/>
    </radialGradient>
    <radialGradient id="green" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#b7ec8f"/>
      <stop offset="0.45" stop-color="#63cd3c"/>
      <stop offset="1" stop-color="#3f9e24"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Bottom lip highlight on each dome -->
    <linearGradient id="lip" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="capsuleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="lampShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Body squircle (824×824 on the Apple icon grid, transparent margins) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <!-- Thin inset outline, like the reference's machined edge -->
  <rect x="128" y="128" width="768" height="768" rx="162" fill="none"
        stroke="#4d525c" stroke-opacity="0.55" stroke-width="4"/>

  <!-- Capsule housing: heavy bezel rim around a near-black interior -->
  <g filter="url(#capsuleShadow)">
    <rect x="340" y="135" width="344" height="754" rx="172" fill="url(#rim)"/>
  </g>
  <rect x="370" y="165" width="284" height="694" rx="142" fill="url(#capsuleInner)"/>

  <!-- Lamps: dark socket, saturated dome, bottom lip, top gloss -->
  <g>
    <circle cx="512" cy="283" r="118" fill="#0c0e11"/>
    <g filter="url(#lampShadow)"><circle cx="512" cy="283" r="110" fill="url(#red)"/></g>
    <circle cx="512" cy="283" r="105" fill="none" stroke="url(#lip)" stroke-width="10"/>
    <ellipse cx="502" cy="237" rx="64" ry="36" fill="url(#gloss)"/>
  </g>
  <g>
    <circle cx="512" cy="512" r="118" fill="#0c0e11"/>
    <g filter="url(#lampShadow)"><circle cx="512" cy="512" r="110" fill="url(#orange)"/></g>
    <circle cx="512" cy="512" r="105" fill="none" stroke="url(#lip)" stroke-width="10"/>
    <ellipse cx="502" cy="466" rx="64" ry="36" fill="url(#gloss)"/>
  </g>
  <g>
    <circle cx="512" cy="741" r="118" fill="#0c0e11"/>
    <g filter="url(#lampShadow)"><circle cx="512" cy="741" r="110" fill="url(#green)"/></g>
    <circle cx="512" cy="741" r="105" fill="none" stroke="url(#lip)" stroke-width="10"/>
    <ellipse cx="502" cy="695" rx="64" ry="36" fill="url(#gloss)"/>
  </g>
</svg>
