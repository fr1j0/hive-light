<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="600" height="170" role="img" aria-label="Hive Light menu-bar icon states">
  <defs>
    <filter id="halo" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <g id="shell">
      <rect x="-22.8" y="30" width="45.6" height="68" rx="15.2" ry="15.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4.8"/>
      <rect x="-16.8" y="36" width="33.6" height="56" rx="10" ry="10" fill="#19191E" fill-opacity="0.95"/>
    </g>
  </defs>
  <rect x="6" y="6" width="588" height="158" rx="20" ry="20" fill="#1C1E21"/>

  <!-- Needs you: red lit, orange + green holes -->
  <g transform="translate(75,0)">
    <use href="#shell"/>
    <circle cx="0" cy="46.8" r="7.2" fill="#FF3B30" filter="url(#halo)"/>
    <circle cx="0" cy="46.8" r="7.2" fill="#FF3B30"/>
    <circle cx="0" cy="64" r="6.8" fill="#1C1E21"/>
    <circle cx="0" cy="81.2" r="6.8" fill="#1C1E21"/>
  </g>
  <text x="75" y="132" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#E6E6E6" text-anchor="middle">Needs you</text>

  <!-- Working: orange lit, red + green holes -->
  <g transform="translate(225,0)">
    <use href="#shell"/>
    <circle cx="0" cy="46.8" r="6.8" fill="#1C1E21"/>
    <circle cx="0" cy="64" r="7.2" fill="#FF9500" filter="url(#halo)"/>
    <circle cx="0" cy="64" r="7.2" fill="#FF9500"/>
    <circle cx="0" cy="81.2" r="6.8" fill="#1C1E21"/>
  </g>
  <text x="225" y="132" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#E6E6E6" text-anchor="middle">Working</text>

  <!-- Idle: green lit, red + orange holes -->
  <g transform="translate(375,0)">
    <use href="#shell"/>
    <circle cx="0" cy="46.8" r="6.8" fill="#1C1E21"/>
    <circle cx="0" cy="64" r="6.8" fill="#1C1E21"/>
    <circle cx="0" cy="81.2" r="7.2" fill="#34C759" filter="url(#halo)"/>
    <circle cx="0" cy="81.2" r="7.2" fill="#34C759"/>
  </g>
  <text x="375" y="132" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#E6E6E6" text-anchor="middle">Idle</text>

  <!-- No sessions: all holes -->
  <g transform="translate(525,0)">
    <use href="#shell"/>
    <circle cx="0" cy="46.8" r="6.8" fill="#1C1E21"/>
    <circle cx="0" cy="64" r="6.8" fill="#1C1E21"/>
    <circle cx="0" cy="81.2" r="6.8" fill="#1C1E21"/>
  </g>
  <text x="525" y="132" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#E6E6E6" text-anchor="middle">No sessions</text>
</svg>
