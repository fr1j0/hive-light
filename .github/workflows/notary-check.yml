# Manual probe for the Apple notarization gate (case 102930081454).
# Submits a dummy zip: statusCode 7000 => team still not configured;
# an accepted submission (even one that ends "Invalid" — the dummy is
# unsigned) => Apple has enabled notarization and the release train can
# flip NOTARIZE=true.
name: Notary status check

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Fetch the notarytool log for this submission id instead of probing"
        required: false
        default: ""

jobs:
  probe:
    runs-on: macos-14
    steps:
      - name: Submit dummy zip to notary service
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -uo pipefail
          if [ -n "${{ inputs.submission_id }}" ]; then
            xcrun notarytool log "${{ inputs.submission_id }}"               --apple-id "$APPLE_ID"               --team-id "$APPLE_TEAM_ID"               --password "$APPLE_APP_PASSWORD"
            exit 0
          fi
          echo "hive" > hello.txt
          zip -q probe.zip hello.txt
          out=$(xcrun notarytool submit probe.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait 2>&1) || true
          echo "$out"
          # The submit output NEVER carries statusCode 7000 — a team-blocked
          # submission still runs In Progress -> Rejected. The only reliable
          # verdict is the submission LOG's statusCode (2026-07-08 false alarm).
          sub_id=$(echo "$out" | grep -oE 'id: [a-f0-9-]{36}' | head -1 | cut -d' ' -f2)
          if [ -z "$sub_id" ]; then
            echo "::warning::Could not parse a submission id — read the output above."
            exit 0
          fi
          log=$(xcrun notarytool log "$sub_id" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" 2>&1) || true
          echo "$log"
          code=$(echo "$log" | grep -oE '"statusCode": [0-9]+' | grep -oE '[0-9]+' | head -1)
          if [ "$code" = "7000" ]; then
            echo "::notice::Team is STILL NOT configured for notarization (statusCode 7000)."
          elif [ -n "$code" ]; then
            echo "::notice::statusCode $code — NOT the team block. Read the issues list above; the gate may have cleared."
          else
            echo "::notice::No statusCode in the log (probe was analyzed for real) — NOTARIZATION IS ENABLED. Flip NOTARIZE=true and run the unlock sequence."
          fi
